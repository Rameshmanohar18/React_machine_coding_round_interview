<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Products catalog with images, video, search and pagination."
    />
    <title>Acme Demo — Products</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <header class="site-header container">
      <a class="brand" href="index.html">Acme Demo</a>
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html" aria-current="page">Products</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <h1>Products</h1>

      <div class="controls">
        <label for="search">Search products</label>
        <input
          id="search"
          aria-label="Search products"
          placeholder="Search by name or description"
        />
        <label for="perPage">Per page</label>
        <select id="perPage">
          <option value="6">6</option>
          <option value="12" selected>12</option>
          <option value="24">24</option>
        </select>
      </div>

      <div id="product-grid" class="product-grid" aria-live="polite"></div>

      <nav class="pagination" aria-label="Pagination" id="pagination"></nav>
    </main>
    <footer class="site-footer container">
      <p>&copy; <span id="year2"></span> Acme Demo</p>
    </footer>

    <script>
      // Sample product data (in real project fetch from API)
      const PRODUCTS = [];
      for (let i = 1; i <= 48; i++) {
        PRODUCTS.push({
          id: i,
          name: `Product ${i}`,
          price: (9.99 + i).toFixed(2),
          desc: `This is an engaging description for product ${i}.`,
          img: `assets/prod${(i % 6) + 1}.jpg`,
          video: i % 8 === 0 ? `assets/video${(i % 3) + 1}.mp4` : null,
        });
      }
      window.PRODUCTS = PRODUCTS;
    </script>
  </body>
</html>
